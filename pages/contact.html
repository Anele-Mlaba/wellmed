        <ul id="cHours" style="list-style: none; padding: 0; margin: 0; font-size: var(--fs-sm);"></ul>
      </div></div>

<!-- Map -->
<section class="section" style="padding-top: 0;">
  <div class="container-wm">
    <div class="reveal" style="border-radius: var(--radius-lg); overflow: hidden; aspect-ratio: 16/7; position: relative;">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3464.7711213273055!2d31.08157728713188!3d-29.726388452346185!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1ef70f5a461a4887%3A0x239aa53091f6547!2s4%20Lagoon%20Dr%2C%20Umhlanga%2C%20uMhlanga%2C%204320!5e0!3m2!1sen!2sza!4v1779815545709!5m2!1sen!2sza" style="position:absolute; inset:0; width:100%; height:100%; border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

<script src="../js/config.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/layout.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("cIc1").innerHTML = WM.icons.pin;
    document.getElementById("cIc2").innerHTML = WM.icons.phone;
    document.getElementById("cIc3").innerHTML = WM.icons.mail;
    document.getElementById("cIc4").innerHTML = WM.icons.clock;

    document.getElementById("cAddr").textContent = WM.brand.address;
    const tel = document.getElementById("cTelLink");
    tel.href = "tel:" + WM.brand.phone.replace(/\s/g, "");
    tel.textContent = WM.brand.phone;
    const wa = document.getElementById("cWaLink");
    wa.href = "https://wa.me/" + WM.brand.whatsapp.replace(/[^\d]/g, "");
    wa.textContent = WM.brand.whatsapp;
    const em = document.getElementById("cEmailLink");
    em.href = "mailto:" + WM.brand.email;
    em.textContent = WM.brand.email;

    const hrs = document.getElementById("cHours");
    hrs.innerHTML = WM.brand.hours.map(h =>
      `<li style="display:flex; flex-wrap:wrap; justify-content:space-between; gap:0.25rem 0.75rem; padding: 0.4rem 0; border-bottom: 1px solid var(--color-line-soft);"><span>${h.day}</span><span class="muted">${h.hours}</span></li>`
    ).join("");

    const form = document.getElementById("contactForm");
    if (!form) return;
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      let valid = true;
      ["cName","cEmail","cMsg","cConsent"].forEach(id => {
        const el = document.getElementById(id);
        const field = el.closest(".field") || el.parentElement;
        const ok = el.checkValidity();
        if (field.classList) field.classList.toggle("has-error", !ok);
        if (!ok) valid = false;
      });
      if (!valid) return;

      const payload = {
        name: cName.value, email: cEmail.value, phone: cPhone.value,
        topic: cTopic.value, message: cMsg.value, ts: new Date().toISOString()
      };

      const submitBtn = form.querySelector('button[type="submit"]');
      const originalLabel = submitBtn ? submitBtn.textContent : null;
      if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = "Sending…"; }

      try {
        const r = await fetch(WM.api.url(WM.api.endpoints.submitContact), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!r.ok) throw new Error("contact " + r.status);
        document.getElementById("contactSuccess").style.display = "block";
        form.reset();
      } catch (err) {
        alert("We couldn't send your message right now. Please try again, or email " + WM.brand.email + ".");
      } finally {
        if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = originalLabel; }
      }
    });
  });
</script>
</body>
