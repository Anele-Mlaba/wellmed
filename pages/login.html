<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sign In — WellMed Wellness</title>
<meta name="description" content="Sign in to your WellMed profile to book appointments faster." />
<meta name="robots" content="noindex,follow" />

<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=Caveat:wght@500&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="icon" type="image/svg+xml" href="../assets/images/logo.svg" />
</head>
<body>

<div id="site-header"></div>

<section class="section" style="padding-top: var(--space-6);">
  <div class="container-wm" style="max-width: 460px;">
    <div class="card-wm" style="padding: var(--space-7);">
      <h2 style="margin-bottom: 0.5rem;">Welcome <em class="serif">back</em></h2>
      <p class="muted" style="margin-bottom: 2rem;">Sign in and your details fill themselves in when you book.</p>

      <form class="form-wm" id="loginForm" novalidate>
        <div class="field">
          <label for="lEmail">Email</label>
          <input id="lEmail" type="email" autocomplete="email" required />
          <div class="error">A valid email is required.</div>
        </div>
        <div class="field">
          <label for="lPassword">Password</label>
          <input id="lPassword" type="password" autocomplete="current-password" required />
          <div class="error">Password required.</div>
        </div>
        <div id="loginError" style="color: var(--color-danger); margin-bottom: 1rem;" hidden></div>
        <button type="submit" class="btn-wm btn-wm--primary btn-wm--lg" id="loginBtn" style="width: 100%;">Sign In</button>
      </form>

      <p class="muted" style="margin: 1.5rem 0 0; font-size: var(--fs-sm); text-align: center;">
        No profile yet? <a href="register.html">Create one</a><br />
        <a href="https://wa.me/27749152513?text=Hi%2C%20I%27ve%20forgotten%20my%20WellMed%20password" target="_blank" rel="noopener">Forgot your password?</a>
      </p>
    </div>
  </div>
</section>

<div id="site-footer"></div>

<script src="../js/config.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/layout.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const returnTo = params.get("return") || "account.html";

  if (WMAuth.isAuthenticated()) { location.replace(returnTo); return; }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    const errEl = document.getElementById("loginError");
    errEl.hidden = true;
    btn.disabled = true;
    btn.textContent = "Signing in…";
    try {
      await WMAuth.login({
        email: document.getElementById("lEmail").value,
        password: document.getElementById("lPassword").value
      });
      location.href = returnTo;
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "Sign In";
      errEl.textContent = err.message;
      errEl.hidden = false;
    }
  });
})();
</script>
</body>
</html>
