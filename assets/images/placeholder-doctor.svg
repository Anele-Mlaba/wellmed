<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cddf9d"/>
      <stop offset="100%" stop-color="#fffdd0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#ecc28a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ecc28a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="220" fill="url(#glow)"/>
  <!-- Stylized portrait silhouette -->
  <g transform="translate(200 270)">
    <!-- Hair -->
    <path d="M -90 -75 Q -95 -140 0 -150 Q 95 -140 90 -75 Q 95 -55 80 -40 L 80 -10 Q 60 -5 40 -8 L 40 -50 Q 0 -60 -40 -50 L -40 -8 Q -60 -5 -80 -10 L -80 -40 Q -95 -55 -90 -75 Z" fill="#5e5e00"/>
    <!-- Face -->
    <ellipse cx="0" cy="-40" rx="55" ry="68" fill="#e8c39e"/>
    <!-- Neck -->
    <rect x="-20" y="20" width="40" height="40" rx="8" fill="#dfa97b"/>
    <!-- Lab coat -->
    <path d="M -130 230 Q -135 80 -50 50 L -20 60 L 0 80 L 20 60 L 50 50 Q 135 80 130 230 Z" fill="#fefefe"/>
    <path d="M -50 50 L 0 230 L 50 50" stroke="#e8e5d0" stroke-width="2" fill="none"/>
    <!-- Stethoscope -->
    <path d="M -25 65 Q -45 110 -30 150 Q -15 175 0 165" stroke="#808000" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 25 65 Q 45 110 30 150" stroke="#808000" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="170" r="10" fill="#808000"/>
    <circle cx="0" cy="170" r="5" fill="#5e5e00"/>
    <!-- Eyes (closed/serene) -->
    <path d="M -22 -45 Q -15 -50 -8 -45" stroke="#3a2a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 22 -45 Q 15 -50 8 -45" stroke="#3a2a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Soft smile -->
    <path d="M -12 -20 Q 0 -12 12 -20" stroke="#a05533" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Decorative leaf -->
  <g transform="translate(50 80)" opacity="0.5">
    <path d="M0 0 Q 30 -10 40 -40 Q 10 -30 0 0 Z" fill="#808000"/>
  </g>
  <g transform="translate(330 420)" opacity="0.4">
    <path d="M0 0 Q -25 -8 -32 -32 Q -8 -25 0 0 Z" fill="#808000"/>
  </g>
</svg>
