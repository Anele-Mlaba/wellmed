<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdd0"/>
      <stop offset="50%" stop-color="#cddf9d"/>
      <stop offset="100%" stop-color="#a3a341"/>
    </linearGradient>
    <radialGradient id="r1" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#ecc28a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ecc28a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#g1)"/>
  <rect width="1600" height="900" fill="url(#r1)"/>
  <!-- Soft organic shapes -->
  <g opacity="0.35">
    <ellipse cx="1300" cy="200" rx="280" ry="220" fill="#fffdd0"/>
    <ellipse cx="200" cy="700" rx="320" ry="180" fill="#fffdd0"/>
  </g>
  <!-- Eucalyptus leaves -->
  <g transform="translate(100 100)" opacity="0.45">
    <ellipse cx="40" cy="40" rx="30" ry="14" fill="#808000" transform="rotate(30 40 40)"/>
    <ellipse cx="80" cy="80" rx="32" ry="14" fill="#5e5e00" transform="rotate(45 80 80)"/>
    <ellipse cx="60" cy="120" rx="30" ry="14" fill="#808000" transform="rotate(60 60 120)"/>
    <line x1="20" y1="20" x2="80" y2="140" stroke="#5e5e00" stroke-width="2"/>
  </g>
  <g transform="translate(1400 700)" opacity="0.5">
    <ellipse cx="0" cy="0" rx="36" ry="16" fill="#808000" transform="rotate(-20 0 0)"/>
    <ellipse cx="-40" cy="-40" rx="34" ry="15" fill="#5e5e00" transform="rotate(-45 -40 -40)"/>
    <ellipse cx="-30" cy="40" rx="32" ry="14" fill="#808000" transform="rotate(20 -30 40)"/>
  </g>
</svg>
