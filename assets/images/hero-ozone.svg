<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="goz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fffdd0"/>
      <stop offset="100%" stop-color="#cddf9d"/>
    </linearGradient>
    <radialGradient id="roz" cx="0.7" cy="0.4" r="0.55">
      <stop offset="0%" stop-color="#a3a341" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a3a341" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#goz)"/>
  <rect width="1600" height="900" fill="url(#roz)"/>
  <!-- Molecular O3 motif: three connected circles -->
  <g transform="translate(1180 360)" opacity="0.55">
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#5e5e00" stroke-width="3"/>
    <line x1="0" y1="-78" x2="-90" y2="0" stroke="#5e5e00" stroke-width="3"/>
    <line x1="0" y1="-78" x2="90" y2="0" stroke="#5e5e00" stroke-width="3"/>
    <circle cx="-90" cy="0" r="42" fill="#808000"/>
    <circle cx="90" cy="0" r="42" fill="#808000"/>
    <circle cx="0" cy="-78" r="42" fill="#5e5e00"/>
    <text x="-90" y="6" font-family="serif" font-size="28" fill="#fffdd0" text-anchor="middle">O</text>
    <text x="90" y="6" font-family="serif" font-size="28" fill="#fffdd0" text-anchor="middle">O</text>
    <text x="0" y="-72" font-family="serif" font-size="28" fill="#fffdd0" text-anchor="middle">O</text>
    <!-- Soft halo -->
    <circle cx="0" cy="-26" r="160" stroke="#a3a341" stroke-width="2" fill="none" stroke-dasharray="4 8" opacity="0.5"/>
  </g>
  <g opacity="0.35">
    <ellipse cx="280" cy="700" rx="280" ry="100" fill="#fffdd0"/>
    <circle cx="380" cy="180" r="100" fill="#a3a341"/>
  </g>
</svg>
