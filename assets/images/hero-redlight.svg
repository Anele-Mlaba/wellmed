<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdd0"/>
      <stop offset="100%" stop-color="#ecc28a"/>
    </linearGradient>
    <radialGradient id="rrl" cx="0.7" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#d38d3d" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#d38d3d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d38d3d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#grl)"/>
  <rect width="1600" height="900" fill="url(#rrl)"/>
  <!-- Sun/light rays motif -->
  <g transform="translate(1180 380)" opacity="0.5">
    <circle cx="0" cy="0" r="80" fill="#d38d3d"/>
    <g stroke="#d38d3d" stroke-width="3" stroke-linecap="round">
      <line x1="-130" y1="0" x2="-100" y2="0"/>
      <line x1="100" y1="0" x2="130" y2="0"/>
      <line x1="0" y1="-130" x2="0" y2="-100"/>
      <line x1="0" y1="100" x2="0" y2="130"/>
      <line x1="-92" y1="-92" x2="-71" y2="-71"/>
      <line x1="71" y1="71" x2="92" y2="92"/>
      <line x1="-92" y1="92" x2="-71" y2="71"/>
      <line x1="71" y1="-71" x2="92" y2="-92"/>
    </g>
  </g>
  <g opacity="0.35">
    <ellipse cx="280" cy="720" rx="320" ry="120" fill="#fffdd0"/>
  </g>
</svg>
